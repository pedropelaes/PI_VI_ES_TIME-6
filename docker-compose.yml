services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartscout
      POSTGRES_PASSWORD: smartscout
      POSTGRES_DB: smartscout_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TEST_DATABASE_URL=postgresql://smartscout:smartscout@postgres-test:5432/smartscout_test
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TZ=UTC
    volumes:
      - ./backend:/app
      - ./ml:/app/ml
      - ./backend/uploads:/app/uploads
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  web:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    depends_on:
      - api